<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#172554"/><stop offset=".45" stop-color="#06b6d4"/><stop offset=".7" stop-color="#facc15"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:18px}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1800" height="760" fill="white"/>
  <text x="900" y="55" text-anchor="middle" class="title">Point-Box Prompt Refinement Segmentation Module</text>
  <text x="900" y="85" text-anchor="middle" class="small">Language-conditioned attention is converted into local, complementary SAM prompts.</text>

  <rect x="45" y="160" width="260" height="420" rx="18" class="panel"/>
  <text x="175" y="205" text-anchor="middle" class="label">VLM attention</text>
  <text x="175" y="233" text-anchor="middle" class="small">deep-layer weighted fusion</text>
  <rect x="80" y="265" width="190" height="190" rx="10" fill="url(#heat)"/>
  <path d="M105 405 C135 340 162 425 195 335 S235 395 250 305" stroke="white" opacity=".65" fill="none" stroke-width="6"/>
  <text x="175" y="500" text-anchor="middle" class="small">Upsample + normalize</text>
  <text x="175" y="528" text-anchor="middle" class="small">Gaussian smoothing</text>

  <path class="arrow" d="M305 370 H385"/>
  <rect x="390" y="160" width="275" height="420" rx="18" class="panel"/>
  <text x="527" y="205" text-anchor="middle" class="label">Saliency regions</text>
  <text x="527" y="233" text-anchor="middle" class="small">threshold + connected components</text>
  <rect x="428" y="265" width="200" height="190" rx="10" fill="#0f172a"/>
  <path d="M458 380 C470 302 550 290 570 350 C610 344 609 418 548 422 C490 438 440 425 458 380" fill="#facc15"/>
  <circle cx="520" cy="365" r="9" fill="#ef4444" stroke="white" stroke-width="3"/>
  <text x="527" y="500" text-anchor="middle" class="small">centroid cₖ and saliency H(cₖ)</text>

  <path class="arrow" d="M665 370 H745"/>
  <rect x="750" y="125" width="405" height="490" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="952" y="175" text-anchor="middle" class="label">Point-Box prompt construction</text>
  <text x="952" y="203" text-anchor="middle" class="small">extremal point diffusion within radius r</text>
  <rect x="790" y="245" width="325" height="220" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="855" y="286" width="188" height="122" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="12 8"/>
  <circle cx="948" cy="347" r="48" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#ef4444"><circle cx="948" cy="347" r="8"/><circle cx="920" cy="325" r="6"/><circle cx="978" cy="326" r="6"/><circle cx="918" cy="369" r="6"/><circle cx="976" cy="375" r="6"/><circle cx="948" cy="389" r="6"/></g>
  <text x="952" y="505" text-anchor="middle" class="small">positive points Pₖ</text>
  <text x="952" y="534" text-anchor="middle" class="small">enclosing box Bₖ</text>
  <text x="952" y="570" text-anchor="middle" class="small">local cues prevent distractor leakage</text>

  <path class="arrow" d="M1155 370 H1235"/>
  <rect x="1240" y="160" width="230" height="420" rx="18" class="panel"/>
  <text x="1355" y="205" text-anchor="middle" class="label">SAM</text>
  <text x="1355" y="233" text-anchor="middle" class="small">image + prompt encoder</text>
  <rect x="1280" y="280" width="150" height="150" rx="75" fill="#7c3aed"/>
  <text x="1355" y="352" text-anchor="middle" font-size="27" font-weight="700" fill="white">Mask</text>
  <text x="1355" y="383" text-anchor="middle" font-size="20" fill="white">decoder</text>
  <text x="1355" y="500" text-anchor="middle" class="small">multimask predictions</text>

  <path class="arrow" d="M1470 370 H1540"/>
  <rect x="1545" y="160" width="215" height="420" rx="18" class="panel"/>
  <text x="1652" y="205" text-anchor="middle" class="label">Refined mask</text>
  <text x="1652" y="233" text-anchor="middle" class="small">score + mask NMS</text>
  <rect x="1580" y="280" width="145" height="145" rx="8" fill="#e2e8f0"/>
  <path d="M1600 385 C1605 310 1660 290 1690 337 C1730 355 1715 405 1672 408 C1628 425 1590 418 1600 385" fill="#22c55e" opacity=".85"/>
  <text x="1652" y="500" text-anchor="middle" class="small">high-confidence result</text>
  <path d="M952 615 V680 H1652 V600" stroke="#64748b" stroke-width="2.5" fill="none" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <text x="1300" y="716" text-anchor="middle" class="small">Low-confidence fallback: region growing → box prompt; otherwise point-only SAM.</text>
</svg>
